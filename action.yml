name: 'Flare Deploy Webhook'
description: 'Post-deploy security review. Compares cloud audit logs before and after each deploy.'
author: 'Flare AI'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  token:
    description: 'Flare webhook token (starts with flr_). Generate one from the Connectors page at tryflare.ai.'
    required: true
  api-url:
    description: 'Flare webhook endpoint URL. Override only for self-hosted or staging.'
    required: false
    default: 'https://tryflare.ai/api/webhooks/deploy'
  commit-sha:
    description: 'Git commit SHA of the deployment. Defaults to the current commit.'
    required: false
    default: ${{ github.sha }}
  branch:
    description: 'Branch that was deployed. Defaults to the current branch.'
    required: false
    default: ${{ github.ref_name }}
  environment:
    description: 'Deployment environment (e.g., production, staging).'
    required: false

outputs:
  analysis-at:
    description: 'ISO timestamp when the post-deploy analysis will run.'
    value: ${{ steps.webhook.outputs.analysis_at }}
  queued:
    description: 'Whether the analysis was successfully queued (true/false).'
    value: ${{ steps.webhook.outputs.queued }}

runs:
  using: 'composite'
  steps:
    - name: Fire Flare deploy webhook
      id: webhook
      shell: bash
      # Expressions are passed only through the environment and referenced as
      # quoted shell variables; branch names can legally contain $, (, ), ` and ;.
      env:
        FLARE_TOKEN: ${{ inputs.token }}
        FLARE_API_URL: ${{ inputs.api-url }}
        DEPLOY_COMMIT_SHA: ${{ inputs.commit-sha }}
        DEPLOY_BRANCH: ${{ inputs.branch }}
        DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      run: |
        set -uo pipefail

        if [ -z "$FLARE_TOKEN" ]; then
          echo "::error::Flare: no webhook token provided. Set the token input (for example from secrets.FLARE_WEBHOOK_TOKEN)."
          echo "queued=false" >> "$GITHUB_OUTPUT"
          exit 1
        fi
        echo "::add-mask::$FLARE_TOKEN"

        # Build JSON payload
        PAYLOAD=$(jq -n \
          --arg sha "$DEPLOY_COMMIT_SHA" \
          --arg branch "$DEPLOY_BRANCH" \
          --arg env "$DEPLOY_ENVIRONMENT" \
          '{commit_sha: $sha, branch: $branch}
          | if $env != "" then .environment = $env else . end')

        WORK_DIR="${RUNNER_TEMP:-/tmp}"
        RESPONSE_FILE=$(mktemp "$WORK_DIR/flare-deploy-response.XXXXXX")
        trap 'rm -f "$RESPONSE_FILE"' EXIT

        # Fire the webhook
        HTTP_CODE=$(curl -sS -o "$RESPONSE_FILE" -w '%{http_code}' \
          --max-time 30 \
          -X POST "$FLARE_API_URL" \
          -H "Authorization: Bearer $FLARE_TOKEN" \
          -H "Content-Type: application/json" \
          -d "$PAYLOAD") || HTTP_CODE="000"
        HTTP_BODY=$(cat "$RESPONSE_FILE")

        # Parse response
        if [ "$HTTP_CODE" = "202" ]; then
          ANALYSIS_AT=$(printf '%s' "$HTTP_BODY" | jq -r '.analysis_at // empty')
          CONNECTOR=$(printf '%s' "$HTTP_BODY" | jq -r '.connector_name // empty')
          echo "analysis_at=$ANALYSIS_AT" >> "$GITHUB_OUTPUT"
          echo "queued=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Flare: post-deploy analysis queued for $CONNECTOR. Results at $ANALYSIS_AT."
        elif [ "$HTTP_CODE" = "401" ]; then
          echo "::error::Flare: authentication failed. Check that FLARE_WEBHOOK_TOKEN is set correctly."
          echo "queued=false" >> "$GITHUB_OUTPUT"
          exit 1
        elif [ "$HTTP_CODE" = "409" ]; then
          echo "::error::Flare: connector is inactive. Reconnect your GCP connector at tryflare.ai."
          echo "queued=false" >> "$GITHUB_OUTPUT"
          exit 1
        elif [ "$HTTP_CODE" = "429" ]; then
          echo "::warning::Flare: daily post-deploy analysis limit reached for this connector. This deploy was not queued."
          echo "queued=false" >> "$GITHUB_OUTPUT"
          exit 0
        elif [ "$HTTP_CODE" = "502" ] || [ "$HTTP_CODE" = "503" ]; then
          echo "::warning::Flare: service temporarily unavailable (HTTP $HTTP_CODE). This deploy was not queued; your deploy is unaffected."
          echo "queued=false" >> "$GITHUB_OUTPUT"
          exit 0
        elif [ "$HTTP_CODE" = "000" ]; then
          echo "::error::Flare: could not reach the Flare webhook endpoint."
          echo "queued=false" >> "$GITHUB_OUTPUT"
          exit 1
        else
          echo "::warning::Flare: unexpected response (HTTP $HTTP_CODE). Body: $HTTP_BODY"
          echo "queued=false" >> "$GITHUB_OUTPUT"
          exit 1
        fi
